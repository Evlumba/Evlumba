<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Evlumba Sonuçları</title>
    <style>
      :root {
        color: #10211b;
        background: #fbfaf6;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #fbfaf6;
      }
      main {
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
      }
      .shell {
        border: 1px solid rgba(42, 71, 62, 0.12);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 50px rgba(15, 35, 29, 0.1);
        overflow: hidden;
      }
      .header {
        padding: 18px 20px;
        border-bottom: 1px solid rgba(42, 71, 62, 0.1);
        background: linear-gradient(135deg, #ffffff 0%, #f4fbf6 100%);
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 10px;
        color: #057a50;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #10b981;
        box-shadow: 0 0 0 6px rgba(16, 185, 129, 0.12);
      }
      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
      }
      .subtitle {
        margin: 8px 0 0;
        color: #607065;
        font-size: 14px;
        line-height: 1.55;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 14px 20px 0;
      }
      .chip {
        border-radius: 999px;
        border: 1px solid rgba(5, 122, 80, 0.16);
        background: #ecfdf5;
        color: #066144;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 650;
      }
      .map-wrap {
        padding: 16px 20px 0;
      }
      .map {
        position: relative;
        min-height: 292px;
        overflow: hidden;
        border: 1px solid rgba(42, 71, 62, 0.12);
        border-radius: 22px;
        background:
          radial-gradient(circle at 22% 72%, rgba(125, 199, 162, 0.38) 0 8%, transparent 9%),
          radial-gradient(circle at 82% 18%, rgba(125, 199, 162, 0.32) 0 9%, transparent 10%),
          linear-gradient(160deg, rgba(226, 243, 236, 0.92), rgba(248, 251, 247, 0.92) 48%, rgba(203, 230, 244, 0.96) 49%, rgba(183, 219, 240, 0.96) 60%, rgba(248, 251, 247, 0.94) 61%),
          repeating-linear-gradient(25deg, transparent 0 30px, rgba(91, 111, 129, 0.18) 31px 33px),
          repeating-linear-gradient(120deg, transparent 0 42px, rgba(91, 111, 129, 0.12) 43px 45px);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }
      .map::before,
      .map::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .map::before {
        background:
          linear-gradient(75deg, transparent 0 19%, rgba(255, 255, 255, 0.7) 20% 21%, transparent 22%),
          linear-gradient(145deg, transparent 0 56%, rgba(255, 255, 255, 0.65) 57% 58%, transparent 59%),
          linear-gradient(10deg, transparent 0 66%, rgba(255, 255, 255, 0.58) 67% 68%, transparent 69%);
      }
      .map-title {
        position: absolute;
        left: 18px;
        top: 16px;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        border: 1px solid rgba(5, 122, 80, 0.16);
        background: rgba(255, 255, 255, 0.9);
        color: #0b6b46;
        padding: 7px 11px;
        font-size: 12px;
        font-weight: 800;
        backdrop-filter: blur(8px);
      }
      .map-label {
        position: absolute;
        left: 50%;
        top: 52%;
        transform: translate(-50%, -50%);
        color: rgba(9, 24, 20, 0.44);
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
      }
      .map-water-label {
        position: absolute;
        left: 57%;
        bottom: 34px;
        transform: translateX(-50%);
        color: rgba(4, 69, 104, 0.4);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .marker {
        position: absolute;
        z-index: 3;
        left: var(--x);
        top: var(--y);
        transform: translate(-50%, -100%);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid rgba(11, 107, 70, 0.2);
        border-radius: 999px 999px 999px 8px;
        background: #ffffff;
        color: #10211b;
        box-shadow: 0 10px 26px rgba(10, 35, 28, 0.18);
        font-size: 12px;
        font-weight: 850;
        text-decoration: none;
        white-space: nowrap;
      }
      .marker:hover {
        background: #0b6b46;
        color: #fff;
      }
      .marker-name {
        position: absolute;
        left: 50%;
        top: calc(100% + 5px);
        transform: translateX(-50%);
        max-width: 140px;
        overflow: hidden;
        color: #10211b;
        font-size: 11px;
        font-weight: 800;
        text-overflow: ellipsis;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
        white-space: nowrap;
      }
      .marker:hover .marker-name {
        color: #10211b;
      }
      .grid {
        display: grid;
        gap: 12px;
        padding: 16px 20px 20px;
      }
      .card {
        display: grid;
        grid-template-columns: 84px 1fr;
        gap: 14px;
        min-height: 106px;
        padding: 12px;
        border: 1px solid rgba(42, 71, 62, 0.1);
        border-radius: 18px;
        background: #fff;
        color: inherit;
        text-decoration: none;
      }
      .thumb {
        width: 84px;
        height: 84px;
        border-radius: 16px;
        object-fit: cover;
        background: #eef3ef;
      }
      .type {
        margin: 0 0 4px;
        color: #057a50;
        font-size: 12px;
        font-weight: 700;
      }
      .title {
        margin: 0;
        color: #10211b;
        font-size: 16px;
        line-height: 1.25;
        font-weight: 800;
      }
      .meta,
      .description {
        margin: 6px 0 0;
        color: #617167;
        font-size: 13px;
        line-height: 1.45;
      }
      .description {
        color: #415149;
      }
      .empty {
        padding: 24px 20px 26px;
        color: #617167;
        font-size: 14px;
        line-height: 1.6;
      }
      .footer {
        display: flex;
        justify-content: flex-end;
        padding: 0 20px 20px;
      }
      .open {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border-radius: 14px;
        background: #0b6b46;
        color: #fff;
        font-size: 13px;
        font-weight: 750;
        text-decoration: none;
      }
      .render-panel {
        padding: 18px;
        border: 1px solid rgba(42, 71, 62, 0.1);
        border-radius: 22px;
        background:
          radial-gradient(circle at 12% 10%, rgba(16, 185, 129, 0.1), transparent 34%),
          linear-gradient(135deg, #ffffff 0%, #f8f4eb 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
      }
      .render-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .render-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 16px;
        background: #e8f8ef;
        color: #057a50;
        font-size: 20px;
        font-weight: 850;
      }
      .render-status {
        margin: 8px 0 0;
        color: #617167;
        font-size: 14px;
        line-height: 1.55;
      }
      .render-image {
        display: block;
        width: 100%;
        max-height: 620px;
        margin-top: 16px;
        border: 1px solid rgba(42, 71, 62, 0.1);
        border-radius: 18px;
        background: #eef3ef;
        object-fit: contain;
        box-shadow: 0 16px 42px rgba(15, 35, 29, 0.12);
      }
      .render-pulse {
        position: relative;
        min-height: 240px;
        margin-top: 16px;
        overflow: hidden;
        border-radius: 18px;
        background: linear-gradient(110deg, #edf3ee 8%, #f9fbf7 18%, #edf3ee 33%);
        background-size: 200% 100%;
        animation: shimmer 1.2s linear infinite;
      }
      @keyframes shimmer {
        to {
          background-position-x: -200%;
        }
      }
      @media (max-width: 520px) {
        body {
          padding: 10px;
        }
        .card {
          grid-template-columns: 72px 1fr;
        }
        .thumb {
          width: 72px;
          height: 72px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell">
        <div class="header">
          <p class="eyebrow"><span class="dot"></span>Evlumba</p>
          <h1>Proje ve profesyonel sonuçları</h1>
          <p class="subtitle" id="subtitle">ChatGPT bir Evlumba araması yaptığında sonuçlar burada kartlar halinde görünür.</p>
        </div>
        <div class="filters" id="filters" hidden></div>
        <div class="map-wrap" id="mapWrap" hidden>
          <div class="map" id="map" aria-label="Evlumba profesyonel sonuç haritası">
            <div class="map-title"><span class="dot"></span>Haritada Evlumba sonuçları</div>
            <div class="map-label" id="mapLabel">İstanbul</div>
            <div class="map-water-label">Marmara</div>
          </div>
        </div>
        <div class="grid" id="results"></div>
        <p class="empty" id="empty">Örn. “İstanbul’da modern mutfak projesi bul” veya “Bursa iç mimar öner” diyebilirsin.</p>
        <div class="footer">
          <a class="open" href="https://www.evlumba.com" target="_blank" rel="noreferrer">Evlumba’yı aç</a>
        </div>
      </section>
    </main>
    <script type="module">
      const resultsEl = document.querySelector("#results");
      const filtersEl = document.querySelector("#filters");
      const emptyEl = document.querySelector("#empty");
      const subtitleEl = document.querySelector("#subtitle");
      const mapWrapEl = document.querySelector("#mapWrap");
      const mapEl = document.querySelector("#map");
      const mapLabelEl = document.querySelector("#mapLabel");
      let rpcId = 0;
      const pendingRequests = new Map();
      const CITY_VIEWPORTS = {
        "İstanbul": { label: "İstanbul", minLat: 40.78, maxLat: 41.35, minLng: 28.45, maxLng: 29.55 },
        Ankara: { label: "Ankara", minLat: 39.72, maxLat: 40.08, minLng: 32.55, maxLng: 33.1 },
        "İzmir": { label: "İzmir", minLat: 38.25, maxLat: 38.58, minLng: 26.85, maxLng: 27.35 },
        Bursa: { label: "Bursa", minLat: 40.08, maxLat: 40.33, minLng: 28.75, maxLng: 29.25 },
        Antalya: { label: "Antalya", minLat: 36.78, maxLat: 37.05, minLng: 30.55, maxLng: 30.95 },
        Kayseri: { label: "Kayseri", minLat: 38.58, maxLat: 38.9, minLng: 35.28, maxLng: 35.72 },
      };
      const ISTANBUL_DISTRICTS = {
        Adalar: [40.876, 29.091],
        Arnavutköy: [41.185, 28.738],
        Ataşehir: [40.984, 29.128],
        Avcılar: [40.98, 28.722],
        Bağcılar: [41.034, 28.857],
        Bahçelievler: [40.997, 28.85],
        Bakırköy: [40.982, 28.875],
        Başakşehir: [41.093, 28.802],
        Bayrampaşa: [41.048, 28.9],
        Beşiktaş: [41.043, 29.009],
        Beykoz: [41.126, 29.101],
        Beylikdüzü: [40.982, 28.64],
        Beyoğlu: [41.037, 28.978],
        Büyükçekmece: [41.02, 28.585],
        Çatalca: [41.143, 28.461],
        Çekmeköy: [41.034, 29.173],
        Esenler: [41.044, 28.876],
        Esenyurt: [41.034, 28.68],
        Eyüpsultan: [41.061, 28.937],
        Fatih: [41.017, 28.949],
        Gaziosmanpaşa: [41.075, 28.915],
        Güngören: [41.022, 28.872],
        Kadıköy: [40.991, 29.027],
        Kağıthane: [41.081, 28.973],
        Kartal: [40.905, 29.19],
        Küçükçekmece: [41.003, 28.777],
        Maltepe: [40.936, 29.155],
        Pendik: [40.879, 29.258],
        Sancaktepe: [41.003, 29.231],
        Sarıyer: [41.166, 29.057],
        Silivri: [41.073, 28.247],
        Sultanbeyli: [40.968, 29.263],
        Sultangazi: [41.106, 28.868],
        Şile: [41.176, 29.613],
        Şişli: [41.061, 28.987],
        Tuzla: [40.817, 29.303],
        Ümraniye: [41.025, 29.096],
        Üsküdar: [41.026, 29.015],
        Zeytinburnu: [40.994, 28.904],
      };
      const escapeHtml = (value) =>
        String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      const rpcNotify = (method, params) => window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      const rpcRequest = (method, params) =>
        new Promise((resolve, reject) => {
          const id = ++rpcId;
          pendingRequests.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });
      function renderChips(filters = []) {
        filtersEl.innerHTML = "";
        if (!filters.length) {
          filtersEl.hidden = true;
          return;
        }
        filtersEl.hidden = false;
        filters.forEach((item) => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = item;
          filtersEl.appendChild(chip);
        });
      }
      function cardImage(item) {
        return item.imageUrl || item.coverUrl || "https://www.evlumba.com/web_icon2.png";
      }
      function hashString(value) {
        let hash = 0;
        for (let i = 0; i < value.length; i += 1) hash = (hash * 31 + value.charCodeAt(i)) >>> 0;
        return hash;
      }
      function viewportFor(designers) {
        const cityFromFilter = [...filtersEl.querySelectorAll(".chip")]
          .map((node) => node.textContent || "")
          .find((text) => text.startsWith("Şehir:"))
          ?.replace("Şehir:", "")
          .trim();
        const city = cityFromFilter || designers.find((item) => item.city)?.city || designers[0]?.cities?.[0] || "İstanbul";
        return CITY_VIEWPORTS[city] || {
          label: city || "Türkiye",
          minLat: 35.8,
          maxLat: 42.2,
          minLng: 25.6,
          maxLng: 44.8,
        };
      }
      function designerPoint(item, index, bounds) {
        const district = item.district && ISTANBUL_DISTRICTS[item.district];
        if (district && (item.city === "İstanbul" || item.cities?.includes("İstanbul"))) {
          return { lat: district[0], lng: district[1] };
        }
        const seed = hashString(`${item.id || item.slug || item.name}-${index}`);
        const x = ((seed % 997) / 997 - 0.5) * 0.62;
        const y = (((Math.floor(seed / 997) % 997) / 997) - 0.5) * 0.62;
        const centerLat = (bounds.minLat + bounds.maxLat) / 2;
        const centerLng = (bounds.minLng + bounds.maxLng) / 2;
        return {
          lat: centerLat + y * (bounds.maxLat - bounds.minLat),
          lng: centerLng + x * (bounds.maxLng - bounds.minLng),
        };
      }
      function project(point, bounds) {
        const x = ((point.lng - bounds.minLng) / (bounds.maxLng - bounds.minLng)) * 100;
        const y = ((bounds.maxLat - point.lat) / (bounds.maxLat - bounds.minLat)) * 100;
        return {
          x: Math.min(94, Math.max(6, x)),
          y: Math.min(86, Math.max(16, y)),
        };
      }
      function renderMap(designers) {
        const visible = designers.filter((item) => item && item.url).slice(0, 12);
        if (!visible.length) {
          mapWrapEl.hidden = true;
          return;
        }
        const bounds = viewportFor(visible);
        mapLabelEl.textContent = bounds.label;
        mapEl.querySelectorAll(".marker").forEach((marker) => marker.remove());
        visible.forEach((item, index) => {
          const position = project(designerPoint(item, index, bounds), bounds);
          const rating = Number(item.rating || 0);
          const marker = document.createElement("a");
          marker.className = "marker";
          marker.href = item.url;
          marker.target = "_blank";
          marker.rel = "noreferrer";
          marker.style.setProperty("--x", `${position.x}%`);
          marker.style.setProperty("--y", `${position.y}%`);
          marker.title = `${item.name} - ${rating ? rating.toFixed(1) : "0.0"} yıldız`;
          marker.innerHTML = `★ ${rating ? rating.toFixed(1) : "0.0"} <span class="marker-name">${escapeHtml(item.name)}</span>`;
          mapEl.appendChild(marker);
        });
        mapWrapEl.hidden = false;
      }
      function renderCard(item, kind) {
        const meta =
          kind === "designer"
            ? [item.title, item.city, item.projectCount ? `${item.projectCount} proje` : "", item.rating ? `${item.rating} puan` : ""]
                .filter(Boolean)
                .join(" • ")
            : [item.room, item.style, item.city, item.budget, item.designer?.name].filter(Boolean).join(" • ");
        const description = kind === "designer" ? item.about : item.description;
        return `
          <a class="card" href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">
            <img class="thumb" src="${escapeHtml(cardImage(item))}" alt="" loading="lazy" />
            <div>
              <p class="type">${kind === "designer" ? "Profesyonel" : "Proje"}</p>
              <h2 class="title">${escapeHtml(item.name || item.title)}</h2>
              <p class="meta">${escapeHtml(meta)}</p>
              ${description ? `<p class="description">${escapeHtml(description)}</p>` : ""}
            </div>
          </a>
        `;
      }
      async function renderAsyncJob(job) {
        renderChips([]);
        mapWrapEl.hidden = true;
        emptyEl.hidden = true;
        subtitleEl.textContent = "Evlumba render hazırlanıyor. Görsel birkaç saniye içinde burada görünecek.";
        resultsEl.innerHTML = `
          <div class="render-panel">
            <div class="render-head">
              <span class="render-icon">ev</span>
              <div>
                <p class="type">Evlumba Render</p>
                <h2 class="title">Oda tasarımı hazırlanıyor</h2>
                <p class="render-status">Fotogerçekçi görsel üretimi başladı. Bu işlem kısa bir süre alabilir.</p>
              </div>
            </div>
            <div class="render-pulse" aria-label="Render hazırlanıyor"></div>
          </div>
        `;
        try {
          const response = await fetch(job.endpoint, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              prompt: job.prompt,
              sourceImageUrl: job.sourceImageUrl,
              sourceImageBase64: job.sourceImageBase64,
              quality: job.quality || "low",
              size: job.size || "1024x1024",
            }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.ok || !data.imageBase64) {
            throw new Error(data.message || "Render oluşturulamadı.");
          }
          const mimeType = data.mimeType || "image/png";
          subtitleEl.textContent = "Fotogerçekçi Evlumba render hazır.";
          resultsEl.innerHTML = `
            <div class="render-panel">
              <div class="render-head">
                <span class="render-icon">ev</span>
                <div>
                  <p class="type">Evlumba Render</p>
                  <h2 class="title">Oda tasarımı hazır</h2>
                  <p class="render-status">Bu görsele uygun profesyonel veya proje aramak için sohbette devam edebilirsin.</p>
                </div>
              </div>
              <img class="render-image" src="data:${escapeHtml(mimeType)};base64,${data.imageBase64}" alt="Evlumba oda renderı" />
            </div>
          `;
        } catch (error) {
          const message = error?.message || "Bilinmeyen hata";
          subtitleEl.textContent = "Render tamamlanamadı.";
          resultsEl.innerHTML = `
            <div class="render-panel">
              <div class="render-head">
                <span class="render-icon">ev</span>
                <div>
                  <p class="type">Evlumba Render</p>
                  <h2 class="title">Render oluşturulamadı</h2>
                  <p class="render-status">${escapeHtml(message)} Tekrar denediğinde aynı tasarım isteğiyle yeniden oluşturabilirim.</p>
                </div>
              </div>
            </div>
          `;
        }
      }
      function updateFromResponse(response) {
        const structured = response?.structuredContent ?? response ?? {};
        const renderJob = response?._meta?.renderJob || structured.renderJob;
        if (renderJob?.endpoint && renderJob?.prompt) {
          void renderAsyncJob(renderJob);
          return;
        }
        const designers = Array.isArray(structured.designers) ? structured.designers : [];
        const projects = Array.isArray(structured.projects) ? structured.projects : [];
        const filters = Array.isArray(structured.appliedFilters) ? structured.appliedFilters : [];
        const cards = [...designers.map((item) => renderCard(item, "designer")), ...projects.map((item) => renderCard(item, "project"))];
        renderChips(filters);
        renderMap(designers);
        subtitleEl.textContent = cards.length
          ? `${cards.length} sonuç bulundu. Haritadaki yıldız markerları ve kartlar Evlumba veritabanından geliyor.`
          : "Bu arama için uygun sonuç bulunamadı.";
        resultsEl.innerHTML = cards.join("");
        emptyEl.hidden = cards.length > 0;
      }
      function updateFromOpenAiGlobals() {
        const openai = window.openai;
        if (!openai?.toolOutput && !openai?.toolResponseMetadata) return;
        updateFromResponse({
          structuredContent: openai.toolOutput,
          _meta: openai.toolResponseMetadata,
        });
      }
      window.addEventListener(
        "message",
        (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;
          if (typeof message.id === "number") {
            const pending = pendingRequests.get(message.id);
            if (!pending) return;
            pendingRequests.delete(message.id);
            if (message.error) pending.reject(message.error);
            else pending.resolve(message.result);
            return;
          }
          if (message.method === "ui/notifications/tool-result") updateFromResponse(message.params);
        },
        { passive: true }
      );
      window.addEventListener("openai:set_globals", updateFromOpenAiGlobals, { passive: true });
      async function initializeBridge() {
        try {
          await rpcRequest("ui/initialize", {
            appInfo: { name: "evlumba-results", version: "0.1.0" },
            appCapabilities: {},
            protocolVersion: "2026-01-26",
          });
          rpcNotify("ui/notifications/initialized", {});
        } catch (error) {
          console.error("Evlumba widget bridge failed:", error);
        }
      }
      updateFromOpenAiGlobals();
      void initializeBridge();
    </script>
